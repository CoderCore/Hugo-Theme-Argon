{{ define "information-card" }}
<div class="information-card card bg-white shadow-sm border-0">
    <div class="card-body"><h1 class="information-card-title">{{ .Title | default (T "msgboard") }}</h1></div>
</div>
{{ end }}

{{ define "main" }}
<article class="post card bg-white shadow-sm border-0 message-board-page">
    <div class="post-content">{{ .Content }}</div>
</article>
{{ partial "comments/comments.html" . }}
{{ end }}

{{ define "main-class" }} message-board-page{{ end }}
