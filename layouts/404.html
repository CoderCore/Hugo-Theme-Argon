{{ define "main" }}
<div class="error-404 card bg-white shadow-sm border-0 text-center">
    <div class="card-body" style="padding: 80px 20px;">
        <h1 style="font-size: 120px; margin: 0;">404</h1>
        <h2>{{ T "notFound" }}</h2>
        <p>{{ T "notFoundMessage" }}</p>
        <a href="{{ "/" | relURL }}" class="btn btn-primary">{{ T "backToHome" }}</a>
    </div>
</div>
{{ end }}
