<script src="{{ "/argontheme.js" | relURL }}"></script>
<script src="{{ "/js/custom.js" | relURL }}?v=4da69af"></script>
<script src="{{ "/js/navigation.js" | relURL }}"></script>

{{- $mathRender := .Site.Params.mathRender -}}
{{- if eq $mathRender "mathjax3" }}
<script>
    window.MathJax = {
        tex: {
            inlineMath: [["$", "$"], ["\\(", "\\)"]],
            displayMath: [['$$','$$']],
            processEscapes: true,
            packages: {'[+]': ['noerrors']}
        },
        options: {
            skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
            ignoreHtmlClass: 'tex2jax_ignore',
            processHtmlClass: 'tex2jax_process'
        },
        loader: {
            load: ['[tex]/noerrors']
        }
    };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>
{{- else if eq $mathRender "mathjax2" }}
<script type="text/x-mathjax-config" id="mathjax_v2_script">
    MathJax.Hub.Config({
        messageStyle: "none",
        tex2jax: {
            inlineMath: [["$", "$"], ["\\(", "\\)"]],
            displayMath: [['$$','$$']],
            processEscapes: true,
            skipTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
        },
        menuSettings: {
            zoom: "Hover",
            zscale: "200%"
        },
        "HTML-CSS": {
            showMathMenu: "false"
        }
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@2/MathJax.js?config=TeX-AMS-MML_HTMLorMML" async></script>
{{- else if eq $mathRender "katex" }}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body);"></script>
{{- end }}
