<div class="modal fade" id="blog_categories" tabindex="-1" role="dialog" aria-labelledby="" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">{{ T "categories" }}</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="{{ T "close" }}">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                {{- range $name, $taxonomy := .Site.Taxonomies.categories }}
                <a href="{{ (printf "categories/%s/" ($name | urlize)) | relURL }}" class="badge badge-secondary tag">{{ $name }} <span class="tag-num">({{ len $taxonomy }})</span></a>
                {{- end }}
            </div>
        </div>
    </div>
</div>

</div>
