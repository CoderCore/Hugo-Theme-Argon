# Example configuration for Argon Hugo theme

baseURL: ""
languageCode: "zh-cn"
title: "My Hugo Site"
theme: "Hugo-Theme-Argon"
enableRobotsTXT: true

# Hugo 摘要设置
summaryLength: 70  # 摘要字数（中文按字符计算）
hasCJKLanguage: true  # 启用中文、日文、韩文支持

params:
  description: "Argon Hugo 主题示例站点"
  # 全局设置 - 还原为原始主题色，其他变体将自动计算
  themeColor: '#f8b5ff'  # 主题色（十六进制）
  showCustomizeThemeColorPicker: true
  darkmodeAutoswitch: "system"  # false, alwayson, system, time
  enableAmoledDark: false
  enableImmersionColor: false
  cardRadius: 10
  cardShadow: "default"  # small, big, or empty
  pageLayout: "double" # double, single
  articleListWaterflow: true
  articleListLayout: "1"
  font: "sans-serif"  # sans-serif, serif
  enableExternalFonts: false  # 启用 fonts.loli.net 的 Open Sans / Noto Serif SC
  enableHeadroom: false
  enableBusuanzi: false
  enableCodeHighlight: true
  codeHighlightStyle: "vs2015"

  # 顶栏
  toolbar:
    icon: ""
    iconLink: ""
    title: ""
    blur: true
    menu:
      - name: "首页"
        url: "/"
      - name: "归档"
        url: "/archives/"
      - name: "说说"
        url: "/shuoshuo/"
      - name: "时间线"
        url: "/page/timeline/"
      - name: "作者"
        url: "/page/author/"

  # Banner
  banner:
    title: ""
    enableTypingEffect: true
    typingEffectInterval: 80
    subtitle: "你在看什么喵？"
    size: "fullscreen"   
          # full (完整)  mini (迷你)  fullscreen (全屏)  hidden (隐藏)
    backgroundUrl: ""
    backgroundHideShapes: false
    backgroundColorType: "shape-primary"

  # 侧栏
  sidebar:
    bannerTitle: "My Site"
    bannerSubtitle: ""
    announcement: ""
    menu:
      - name: "首页"
        url: "/"
      - name: "归档"
        url: "/archives/"
    authorImage: ""
    authorName: "Author"
    authorDescription: ""
    authorLinks:
      - name: "GitHub"
        url: "https://github.com/"
    friendLinks: []
    rightbar: []
    showHeadindexNumber: false

  # 文章
  excerpt: true
  excerptLength: 80  # 首页文章摘要长度（字符数），默认 175
  firstImageAsThumbnail: true
  imageProcessing: true
  # 可选字段：time、edittime、views、comments、categories、words、readingtime（read 为 views 兼容别名）
  articleMeta: "time|views|categories"
  showReadingtime: true
  readingSpeedCn: 300
  readingSpeedEn: 160
  showThumbnailInBannerInContentPage: false
  showShareBtn: true
  relatedPosts:
    enabled: false
    limit: 10
  donateQrcodeUrl: ""
  additionalContentAfterPost: ""
  articleHeaderStyle: "2"  # default, 1, 2 - 样式2会在标题前显示彩色竖杠装饰
  shuoshuo:
    showOnHome: false
    homeLimit: 3
    homeTitle: "说说"
  # 自建评论系统。allowGuests=false 时，必须先用 GitHub 登录才能发表评论。
  comments:
    enabled: false
    allowGuests: false
    # endpoint: "" # Worker 的 /api/comments 地址；认证接口使用同一 Worker
    # authEndpoint: "" # 可选，默认使用 endpoint 所在 Worker 的 /api/auth
  # Cloudflare Worker + D1 阅读量服务；endpoint 留空时不显示阅读量
  viewCounter:
    enabled: false
    endpoint: ""
    key: ""
    showOnPreview: true
    requestTimeout: 4000

  # 背景
  pageBackgroundUrl: ""
  pageBackgroundDarkUrl: ""
  pageBackgroundOpacity: 1
  transparentBanner: true

  # 浮动操作按钮
  fab:
    showDarkmodeButton: false
    showSettingsButton: true
    showGotocommentButton: false

  # 平滑滚动
  smoothscroll: 1  # disabled, 1, 1-pulse, 2, 3

  # Zoomify & Fancybox
  enableFancybox: true
  enableZoomify: false
  zoomifyDuration: 200
  zoomifyEasing: "cubic-bezier(0.4,0,0,1)"
  zoomifyScale: 0.9

  # Lazyload
  enableLazyload: true
  lazyloadThreshold: 800
  lazyloadEffect: "fadeIn"
  lazyloadLoadingStyle: 1  # 1-11, none

  # Pangu.js
  enablePangu: false

  # 其他
  pjaxDisabled: false
  enableIntoArticleAnimation: true
  enableMobileScale: false

  # 页脚
  footerHtml: ""

  # 数学公式
  mathRender: "none"  # mathjax3, mathjax2, katex

# 主题栏目配置
mainSections:
  - post

archive:
  monthly: true

# 相关文章匹配规则；主题的 params.relatedPosts.enabled 默认关闭
related:
  threshold: 80
  includeNewer: false
  toLower: false
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 80

# 分页
pagination:
  pagerSize: 10

# 语言设置
defaultContentLanguage: zh-cn

# Markdown 设置
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: vs2015

outputFormats:
  Search:
    mediaType: "application/json"
    baseName: "search"
    isPlainText: true

outputs:
  home:
    - HTML
    - RSS
    - Search
