<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <meta name="theme-color" content="#5e72e4">
    <title>管理员登录 · Argon 后台</title>
    <script>(function(){try{var mode=sessionStorage.getItem('Argon_Enable_Dark_Mode');if(mode==='true')document.documentElement.classList.add('darkmode');}catch(e){}}());</script>
    <link rel="stylesheet" href="/admin/admin.css?v=admin-5">
</head>
<body data-admin-page="login">
<main class="settings-shell admin-login-shell">
    <header class="settings-header">
        <a class="brand" href="/">Argon 后台</a>
        <div class="admin-header-actions"><button id="admin-theme-toggle" class="button button-quiet button-small admin-theme-toggle" type="button" aria-pressed="false"><span class="admin-theme-toggle-icon" aria-hidden="true">☾</span><span class="admin-theme-toggle-label">暗色模式</span></button><a class="back-link" href="/">返回站点</a></div>
    </header>
    <section class="settings-hero">
        <p class="eyebrow">ARGON ADMIN / SIGN IN</p>
        <h1>管理员登录</h1>
        <p>使用唯一配置的 GitHub 管理员账号登录，登录后可在后台页面之间自由切换。</p>
    </section>
    <section class="panel admin-login-card" aria-labelledby="login-title">
        <div class="panel-heading">
            <div><p class="panel-kicker">SECURE SESSION</p><h2 id="login-title">登录后台</h2></div>
        </div>
        <button id="github-admin-login-button" class="button button-github button-wide" type="button">使用 GitHub 登录</button>
        <p class="help">只有 Worker 中配置的唯一 GitHub 管理员账号可以进入后台；其他 GitHub 账号会被拒绝。</p>
        <p class="message" id="login-message" role="status" aria-live="polite"></p>
        <div id="connection-status" class="status status-pending" role="status" aria-live="polite">正在发现站点配置…</div>
        <dl class="endpoint-details">
            <div><dt>发现的 Worker</dt><dd id="endpoint-label">尚未发现</dd></div>
            <div><dt>页面 Origin</dt><dd id="origin-label"></dd></div>
        </dl>
    </section>
</main>
<script src="/admin/admin.js?v=admin-5" defer></script>
</body>
</html>
