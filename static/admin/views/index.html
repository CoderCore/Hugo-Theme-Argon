<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <meta name="theme-color" content="#5e72e4">
    <title>阅读量管理 · Argon 后台</title>
    <script>(function(){try{var mode=sessionStorage.getItem('Argon_Enable_Dark_Mode');if(mode==='true')document.documentElement.classList.add('darkmode');}catch(e){}}());</script>
    <link rel="stylesheet" href="/admin/admin.css?v=admin-5">
</head>
<body data-admin-page="views">
<div class="admin-layout">
    <aside class="admin-sidebar"><a class="admin-brand" href="/admin/"><span class="admin-brand-mark">A</span><span><strong>Argon</strong><small>管理中心</small></span></a><nav id="admin-nav" class="admin-nav" aria-label="后台页面"></nav><div class="admin-sidebar-footer"><a href="/">← 返回站点</a><button id="admin-theme-toggle" class="button button-quiet button-small admin-theme-toggle" type="button" aria-pressed="false"><span class="admin-theme-toggle-icon" aria-hidden="true">☾</span><span class="admin-theme-toggle-label">暗色模式</span></button><button id="logout-button" class="button button-quiet button-small" type="button">退出登录</button></div></aside>
    <main class="admin-main">
        <header class="admin-topbar"><div><p class="eyebrow">ARGON ADMIN / VIEWS</p><h1>阅读量管理</h1><p class="topbar-description">按页读取 D1 中的阅读量记录，标题来自站点搜索索引。</p></div><div id="connection-status" class="status status-pending" role="status" aria-live="polite">正在验证管理员会话…</div></header>
        <section class="admin-content">
            <section id="offline-guide" class="notice notice-warning" hidden><strong>暂时无法连接阅读量 Worker</strong><p>请确认 Worker、D1 绑定、密钥和当前页面 Origin 配置正确。</p><a href="https://github.com/jiang068/Hugo-Theme-Argon/blob/main/cloudflare/view-counter/README.md" target="_blank" rel="noopener">查看部署指南 ↗</a></section>
            <section class="panel panel-views"><div class="panel-heading"><div><p class="panel-kicker">D1 VIEW COUNTS</p><h2>文章阅读量</h2></div><button id="reload-views" class="button button-quiet button-small" type="button">重新读取</button></div>
                <div class="total-editor"><label for="site-total">网站总阅读量（D1 缓存）</label><div class="total-editor-row"><input id="site-total" type="number" min="0" max="2147483647" step="1" value="0" readonly aria-readonly="true"></div></div>
                <div class="views-toolbar"><label class="search-label" for="view-filter">筛选路径</label><input id="view-filter" type="search" placeholder="例如 /hello/"><span id="views-summary" class="summary">尚未读取</span></div>
                <div class="table-wrap"><table><thead><tr><th scope="col">文章</th><th scope="col">路径</th><th scope="col">阅读量</th><th scope="col"><span class="sr-only">操作</span></th></tr></thead><tbody id="views-body"><tr><td colspan="4" class="empty-row">正在读取…</td></tr></tbody></table></div>
                <nav class="admin-pagination" aria-label="阅读量分页"><button id="views-prev" class="button button-quiet button-small" type="button" disabled>上一页</button><span id="views-page" class="summary">第 1 页</span><button id="views-next" class="button button-quiet button-small" type="button" disabled>下一页</button></nav><p id="views-message" class="message" role="status" aria-live="polite"></p>
            </section>
        </section>
        <footer class="settings-footer"><span>Argon · admin surface</span><a href="https://github.com/jiang068/Hugo-Theme-Argon" target="_blank" rel="noopener">主题文档 ↗</a></footer>
    </main>
</div>
<script src="/admin/admin.js?v=admin-5" defer></script>
</body>
</html>
