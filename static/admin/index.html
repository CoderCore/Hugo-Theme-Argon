<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <meta name="theme-color" content="#5e72e4">
    <title>Argon 后台</title>
    <link rel="stylesheet" href="/admin/admin.css">
</head>
<body data-admin-page="home">
<div class="admin-layout">
    <aside class="admin-sidebar">
        <a class="admin-brand" href="/admin/"><span class="admin-brand-mark">A</span><span><strong>Argon</strong><small>管理中心</small></span></a>
        <nav id="admin-nav" class="admin-nav" aria-label="后台页面"></nav>
        <div class="admin-sidebar-footer"><a href="/">← 返回站点</a><button id="logout-button" class="button button-quiet button-small" type="button">退出登录</button></div>
    </aside>
    <main class="admin-main">
        <header class="admin-topbar"><div><p class="eyebrow">ARGON ADMIN</p><h1>站点总览</h1></div><div id="connection-status" class="status status-pending" role="status" aria-live="polite">正在验证管理员会话…</div></header>
        <section class="admin-content">
            <div class="admin-welcome panel"><p class="panel-kicker">CONTROL CENTER</p><h2>欢迎进入站点管理</h2><p>从左侧选择一个模块。每个管理页面独立加载自己的数据，后续可以直接新增页面并接入同一套会话与导航框架。</p></div>
            <section class="admin-module-grid" aria-label="管理模块">
                <a class="admin-module panel" href="/admin/views/"><p class="panel-kicker">D1 VIEW COUNTS</p><h2>阅读量管理</h2><p>按页查看文章标题、路径和阅读量，支持修改与删除。</p><span class="admin-module-link">进入模块 →</span></a>
                <a class="admin-module panel" href="/admin/comments/"><p class="panel-kicker">D1 COMMENTS</p><h2>评论管理</h2><p>按页查看全站评论，按文章、作者和状态筛选并管理。</p><span class="admin-module-link">进入模块 →</span></a>
            </section>
        </section>
        <footer class="settings-footer"><span>Argon · admin surface</span><a href="https://github.com/jiang068/Hugo-Theme-Argon" target="_blank" rel="noopener">主题文档 ↗</a></footer>
    </main>
</div>
<script src="/admin/admin.js?v=admin-3" defer></script>
</body>
</html>
