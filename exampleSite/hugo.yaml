baseURL: ""
languageCode: "zh-cn"
title: "Argon Hugo Theme 示例站点"
theme: "Hugo-Theme-Argon"
enableRobotsTXT: true

# Hugo 摘要设置
summaryLength: 70  # 摘要字数（中文按字符计算）
hasCJKLanguage: true  # 启用中文、日文、韩文支持

params:
  description: "展示 Argon Hugo 主题功能的示例站点"
  # 全局设置
  themeColor: '#5e72e4'  # 主题色（十六进制）
  themeColorRGB: '94, 114, 228'  # 主题色 RGB 值，用于半透明效果（需与 themeColor 对应）
  showCustomizeThemeColorPicker: true
  darkmodeAutoswitch: false
  enableAmoledDark: false
  cardRadius: 4
  cardShadow: ""
  font: "sans-serif"
  enableExternalFonts: false  # 需要主题字体时改为 true
  enableHeadroom: false
  enableBusuanzi: false

  # 顶栏
  toolbar:
    icon: ""
    iconLink: ""
    title: ""
    menu:
      - name: "首页"
        url: "/"
      - name: "归档"
        url: "/archives/"
      - name: "说说"
        url: "/shuoshuo/"
      - name: "时间线"
        url: "/page/timeline/"
      - name: "留言板"
        url: "/page/msgboard/"
      - name: "作者"
        url: "/page/author/"
      - name: "关于"
        url: "/about/"

  # Banner
  banner:
    title: "Argon Hugo Theme"
    enableTypingEffect: false
    typingEffectInterval: 100
    subtitle: "简洁优雅的 Hugo 博客主题"
    backgroundUrl: "/assets/img/banner.jpg"
    backgroundHideShapes: false
    backgroundColorType: "shape-primary"

  # 侧栏
  sidebar:
    bannerTitle: "Argon"
    bannerSubtitle: "优雅简洁"
    announcement: "欢迎使用 Argon Hugo 主题！"
    menu:
      - name: "首页"
        url: "/"
      - name: "归档"
        url: "/archives/"
      - name: "说说"
        url: "/shuoshuo/"
      - name: "时间线"
        url: "/page/timeline/"
      - name: "留言板"
        url: "/page/msgboard/"
      - name: "作者"
        url: "/page/author/"
      - name: "关于"
        url: "/about/"
    authorImage: "/assets/img/auther.jpg"
    authorName: "Argon"
    authorLinks:
      - name: "GitHub"
        url: "https://github.com"
      - name: "Twitter"
        url: "https://twitter.com"
    friendLinks:
      - name: "Hugo"
        url: "https://gohugo.io"
      - name: "GitHub"
        url: "https://github.com"
    rightbar:
      - title: "站点链接"
        items:
          - name: "Hugo"
            url: "https://gohugo.io"
          - name: "Argon"
            url: "https://github.com/solstice23/argon-theme"
    showHeadindexNumber: false

  # 文章
  excerpt: true
  excerptLength: 120  # 首页文章摘要长度（字符数），默认 175
  # 可选字段：time、edittime、views、comments、tags、categories、words、readingtime（read 为 views 兼容别名）
  articleMeta: "time|views|comments|categories|words|readingtime"
  showReadingtime: true
  relatedPosts:
    enabled: true
    limit: 6
  readingSpeedCn: 300
  readingSpeedEn: 160
  showShareBtn: true
  donateQrcodeUrl: ""
  additionalContentAfterPost: ""
  articleHeaderStyle: "2"  # default, 1, 2 - 样式2会在标题前显示彩色竖杠装饰
  shuoshuo:
    showOnHome: true
    homeLimit: 1
    homeTitle: "最近说说"
  comments:
    enabled: true
    allowGuests: false
    allowMarkdown: true
    allowPrivate: true
    allowAnonymous: true
    timeZone: "Asia/Shanghai"
    endpoint: "http://127.0.0.1:8787/api/comments"

  # 背景
  pageBackgroundUrl: ""
  pageBackgroundDarkUrl: ""
  pageBackgroundOpacity: 1
  transparentBanner: false

  # 浮动操作按钮
  fab:
    showDarkmodeButton: true
    showSettingsButton: true
    showGotocommentButton: false

  # 平滑滚动
  smoothscroll: 1

  # Zoomify
  enableZoomify: true
  zoomifyDuration: 200
  zoomifyEasing: "cubic-bezier(0.4,0,0,1)"
  zoomifyScale: 0.9

  # Lazyload
  enableLazyload: true
  lazyloadThreshold: 800
  lazyloadEffect: "fadeIn"
  lazyloadLoadingStyle: 1

  # Pangu.js
  enablePangu: false

  # 其他
  pjaxDisabled: false
  enableIntoArticleAnimation: false
  enableMobileScale: false

  # 页脚
  footerHtml: '<p>© 2024 Argon Hugo Theme. All rights reserved.</p>'

  # 数学公式
  # 使用 MathJax 3 解析 $, $$, \\( \\), \\[ \\] 及其 TeX 环境。
  mathRender: "mathjax3"

# 主题栏目配置
mainSections:
  - post

archive:
  monthly: true

related:
  threshold: 80
  includeNewer: false
  toLower: false
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 80

# 分页
pagination:
  pagerSize: 10

# 语言设置
defaultContentLanguage: zh-cn

# 分类和标签
taxonomies:
  category: categories
  tag: tags

# Markdown 设置
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: monokai

outputFormats:
  Search:
    mediaType: "application/json"
    baseName: "search"
    isPlainText: true

outputs:
  home:
    - HTML
    - RSS
    - Search
